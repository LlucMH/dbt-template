# =============================================================================
# Deployment of poc_dbt. Trigger: push to main (after the PR checks of
# cloudbuild-pr.yaml have passed).
#
#   1. test           scripts/ci_test.sh: the same suite as the pull requests
#                     (lint, pytest, rules, full dbt build on DuckDB).
#   2. manifest       installs the adapter of the deployment warehouse (_DBT_ADAPTER)
#                     and builds target/manifest.json with the deployment target,
#                     which is what Airflow reads.
#   3. docs           optional (_DBT_DOCS_BUCKET not empty): dbt docs generate --static
#                     against the warehouse (it reads the catalog, so it needs read
#                     access) into a single index.html.
#   4. deploy         syncs the project (with dbt_packages/, target/manifest.json and
#                     dags/) to the Composer bucket. Deletes from the bucket whatever
#                     no longer exists in the project, so that Composer never runs
#                     deleted files.
#   5. publish        stores the deployed manifest for the slim CI of the next pull
#                     requests, and the docs page in _DBT_DOCS_BUCKET.
#
# Variables: substitutions below, overridable in the Cloud Build trigger.
# Warehouses other than BigQuery also need their connection variables
# (DBT_SNOWFLAKE_*, DBT_DATABRICKS_*...) in the manifest and docs steps, ideally as
# secretEnv from Secret Manager. See .env.example.
# =============================================================================
substitutions:
  _DBT_ADAPTER: bigquery
  _DBT_TARGET: prod
  _DBT_BQ_LOCATION: europe-southwest1
  _DBT_GCS_BUCKET: europe-southwest1-aaaa-bucket
  _DBT_GCS_PATH: dags/dbt
  _DBT_STATE_PATH: dbt_state/poc_dbt
  _DBT_DOCS_BUCKET: ""
  _PYTHON_IMAGE: python:3.12-slim

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: ${_PYTHON_IMAGE}
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        python -m venv .venv-ci
        . .venv-ci/bin/activate
        pip install --quiet --no-cache-dir -r requirements-dev.txt
        bash scripts/ci_test.sh

  - id: manifest
    name: ${_PYTHON_IMAGE}
    entrypoint: bash
    env:
      - DBT_PROFILES_DIR=.
      - DBT_ADAPTER=${_DBT_ADAPTER}
      - DBT_TARGET=${_DBT_TARGET}
      - DBT_BQ_PROJECT=${PROJECT_ID}
      - DBT_BQ_LOCATION=${_DBT_BQ_LOCATION}
    args:
      - -euo
      - pipefail
      - -c
      - |
        python -m venv .venv-deploy
        . .venv-deploy/bin/activate
        pip install --quiet --no-cache-dir -r requirements/${_DBT_ADAPTER}.txt
        dbt deps
        dbt parse
        if [ -n "${_DBT_DOCS_BUCKET}" ]; then
          dbt docs generate --static
        fi

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - storage
      - rsync
      - --recursive
      - --delete-unmatched-destination-objects
      # Only what dbt and Airflow need at run time is deployed. "$$" is a literal "$":
      # Cloud Build treats a lone "$" as a substitution.
      - --exclude=^\.git|^\.github/|^\.claude/|^\.venv|^logs/|^target_ci/|^state/|^requirements|^scripts/|^sqlfluff_libs/|^dags/tests/|^\.sqlfluff|^\.env|^\.pre-commit-config\.yaml$$|^cloudbuild.*\.yaml$$|^CONTRIBUTING\.md$$|\.duckdb(\.wal)?$$
      - .
      - gs://${_DBT_GCS_BUCKET}/${_DBT_GCS_PATH}

  - id: publish
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        gcloud storage cp target/manifest.json gs://${_DBT_GCS_BUCKET}/${_DBT_STATE_PATH}/manifest.json
        if [ -n "${_DBT_DOCS_BUCKET}" ]; then
          gcloud storage cp target/static_index.html gs://${_DBT_DOCS_BUCKET}/index.html
        fi
