# =============================================================================
# Snapshots of source_database_1
#
# Template conventions:
#   - A snapshot keeps the history (SCD type 2) of a table that the source
#     overwrites: every change closes the previous version (dbt_valid_to) and
#     opens a new one (dbt_valid_from).
#   - Defined in YAML (dbt >= 1.9), one file per source database.
#   - Name: snp_<source_database>__<table>, in one subfolder per source database.
#   - They read from the bronze model, not from source(): bronze stays the only
#     layer that uses source(), and the history is stored already cast and
#     normalized. That is why the bronze model must be light and stable:
#     changing its logic creates new versions of every row.
#   - Nobody reads a snapshot directly: a silver l0 scd_ model exposes it with
#     business column names.
#   - A snapshot cannot be rebuilt: if it is dropped, the history is lost.
#     Never --full-refresh or drop it in ideacion/prod.
#   - Schema (ds_snapshots), tags, labels and persist_docs are inherited from dbt_project.yml.
#
# Strategies (one example of each in this template):
#   - check     (snp_source_database_1__table_2): compares columns; for sources
#               with no reliable modification timestamp.
#   - timestamp (snp_source_database_2__table_1): compares an updated_at column;
#               cheaper, because it does not compare column by column.
# =============================================================================
version: 2

snapshots:
  - name: snp_source_database_1__table_2
    relation: ref('vw_brz_l0_source_database_1__table_2')
    description: >
      Change history of the table_2 catalog of source_database_1.
      One row per version of every field_a.
    config:
      unique_key: field_a
      # check: the catalog has no reliable modification timestamp, so columns
      # are compared.
      strategy: check
      # Business columns only: never _dbt_run_at, which changes on every run
      # and would open a new version of every row on every run.
      check_cols: ["field_b"]
      # Deletions in the source are recorded as one more version (dbt_is_deleted = 'True').
      hard_deletes: new_record
      # Current version with a far end date instead of NULL: simplifies range
      # joins (BETWEEN valid_from AND valid_to). Standard CAST: valid on every
      # warehouse (the data_type() macro cannot be used in YAML).
      dbt_valid_to_current: "CAST('9999-12-31' AS TIMESTAMP)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - field_a
              - dbt_valid_from
    columns:
      - name: field_a
        description: Identifier of the table_2 catalog.
        data_tests:
          - not_null
      - name: field_b
        description: Description of the catalog in this version.
      - name: _dbt_run_at
        description: "{{ doc('col_dbt_run_at') }}"
      - name: dbt_scd_id
        description: Unique identifier of the version, generated by dbt.
      - name: dbt_updated_at
        description: Time dbt detected the version.
      - name: dbt_valid_from
        description: Start of the version's validity.
      - name: dbt_valid_to
        description: End of the version's validity; 9999-12-31 for the current one.
      - name: dbt_is_deleted
        description: "'True' if the version records a deletion in the source."
