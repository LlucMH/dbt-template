# =============================================================================
# Unit tests of use_case_1
#
# Template conventions:
#   - Unit tests check LOGIC with fixed inputs and expected outputs (dbt >= 1.8);
#     data tests check the DATA. Write one for every business rule a data test
#     would not catch.
#   - One unit tests file per domain, next to its models YAML.
#   - Only the columns listed in expect are compared: list the ones the rule is
#     about, never _dbt_run_at.
#   - Inputs avoid warehouse-specific behaviour (e.g. malformed values for
#     dbt.safe_cast), so the same test passes on every warehouse.
#   - Run with dbt build (before the model) or dbt test --select test_type:unit.
#     Python models cannot be unit tested.
# =============================================================================
version: 2

unit_tests:
  - name: gld_group_report_adds_up_every_value_of_a_group
    description: >
      Several table_2 values of the same reporting group become one row with the
      sum of their records, and record_share is that sum over the grand total.
    model: tb_gld_l0_use_case_1__group_report
    given:
      - input: ref('tb_slv_l1_business_entity_1__agg_table_1_by_table_2')
        rows:
          - {table_2_id: "A01", record_count: 1}
          - {table_2_id: "A02", record_count: 2}
          - {table_2_id: "B01", record_count: 1}
      - input: ref('vw_slv_l1_business_entity_1__dim_table_2_with_group')
        rows:
          - {table_2_id: "A01", group_id: "G1", group_desc: "Group 1", group_sort_order: 1}
          - {table_2_id: "A02", group_id: "G1", group_desc: "Group 1", group_sort_order: 1}
          - {table_2_id: "B01", group_id: "G2", group_desc: "Group 2", group_sort_order: 2}
    expect:
      rows:
        - {group_id: "G1", record_count: 3, record_share: 0.75}
        - {group_id: "G2", record_count: 1, record_share: 0.25}
