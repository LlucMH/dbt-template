# =============================================================================
# Exposures of use_case_1
#
# Template conventions:
#   - One exposures file per use case, next to its models YAML.
#   - One exposure per real consumer (dashboard, file, application, alert),
#     consistent with meta.consumer of the models it reads.
#   - owner: team identifier, never real email addresses.
#   - url: fill in with the consumer's real link when it exists.
#
# Orchestration: every exposure is also the scheduling contract of its consumer,
# read by the Airflow DAGs (dags/poc_dbt_dags.py) and checked by
# macros/validate_exposures.sql:
#   tags            the use case and EXACTLY ONE schedule:
#                     daily | weekly | monthly   shared DAG poc_dbt__<schedule>
#                                                (dbt build --select +tag:<schedule>)
#                     custom                     own DAG poc_dbt__<exposure>, at meta.cron
#                                                (dbt build --select +exposure:<name>)
#   meta.cron       only with custom: cron expression in UTC. "2#3" = third Tuesday;
#                   never "15-21 * 2", which cron reads as "days 15-21 OR Tuesdays".
#   meta.ready_by   "HH:MM" UTC: the consumer needs the data by then. A run that
#                   finishes later e-mails meta.notify that the data is late.
#   meta.notify     team alerted when something this exposure needs fails or is late.
#   meta.criticality  low | medium | high: "[HIGH]" in the subject of its alerts.
# =============================================================================
version: 2

exposures:
  - name: use_case_1__table_2_dashboard
    label: table_2 dashboard (use_case_1)
    type: dashboard
    maturity: medium
    description: >
      BI dashboard with the share of table_1 per table_2 and per reporting
      group, with drill-down to the detail of every record.
    owner:
      name: team_use_case_1
    depends_on:
      - ref('tb_gld_l0_use_case_1__table_2_report')
      - ref('vw_gld_l0_use_case_1__table_1_detail')
      - ref('tb_gld_l0_use_case_1__group_report')
    config:
      tags: ["use_case_1", "daily"]
      meta:
        use_case: use_case_1
        consumer: bi
        ready_by: "08:00"
        notify: team_use_case_1
        criticality: medium
