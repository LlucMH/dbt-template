# =============================================================================
# Exposures of use_case_2
#
# Template conventions:
#   - One exposures file per use case, next to its models YAML.
#   - One exposure per real consumer (dashboard, file, application, alert),
#     consistent with meta.consumer of the models it reads.
#   - owner: team identifier, never real email addresses.
#   - url: fill in with the consumer's real link when it exists.
#
# Orchestration: every exposure is also the scheduling contract of its consumer,
# read by the Airflow DAGs (dags/poc_dbt_dags.py) and checked by
# macros/validate_exposures.sql:
#   tags            the use case and EXACTLY ONE schedule:
#                     daily | weekly | monthly   shared DAG poc_dbt__<schedule>
#                                                (dbt build --select +tag:<schedule>)
#                     custom                     own DAG poc_dbt__<exposure>, at meta.cron
#                                                (dbt build --select +exposure:<name>)
#   meta.cron       only with custom: cron expression in UTC. "2#3" = third Tuesday;
#                   never "15-21 * 2", which cron reads as "days 15-21 OR Tuesdays".
#   meta.ready_by   "HH:MM" UTC: the consumer needs the data by then. A run that
#                   finishes later e-mails meta.notify that the data is late.
#   meta.notify     team alerted when something this exposure needs fails or is late.
#   meta.criticality  low | medium | high: "[HIGH]" in the subject of its alerts.
# =============================================================================
version: 2

exposures:
  # CSV file picked up by a third party: a failure blocks their process.
  - name: use_case_2__daily_amount_export
    label: Daily amount CSV export (use_case_2)
    type: application
    maturity: high
    description: >
      CSV file with the daily amount of table_3 per source database, picked up
      by a third party for its own process.
    owner:
      name: team_use_case_2
    depends_on:
      - ref('tb_gld_l0_use_case_2__daily_amount')
    config:
      tags: ["use_case_2", "daily"]
      meta:
        use_case: use_case_2
        consumer: file_export
        export_format: csv
        ready_by: "07:30"
        notify: team_use_case_2
        criticality: high

  # Custom schedule: the monthly review committee meets on the third Tuesday of
  # every month, so the dashboard is refreshed that morning, not on day 1.
  - name: use_case_2__monthly_amount_dashboard
    label: Monthly amount dashboard (use_case_2)
    type: dashboard
    maturity: medium
    description: >
      Monthly summary of the table_3 amount per source database, reviewed by the
      monthly committee on the third Tuesday of every month.
    owner:
      name: team_use_case_2
    depends_on:
      - ref('tb_gld_l1_use_case_2__monthly_amount')
    config:
      tags: ["use_case_2", "custom"]
      meta:
        use_case: use_case_2
        consumer: bi
        cron: "0 6 * * 2#3"
        ready_by: "09:00"
        notify: team_use_case_2
        criticality: medium

  # Alert e-mail sent by Airflow (dags/) when the anomalies view returns rows.
  - name: use_case_2__amount_anomaly_alert
    label: Amount anomaly alert (use_case_2)
    type: application
    maturity: medium
    description: >
      E-mail sent after the daily dbt build when the latest loaded day has an
      anomalous amount. dbt prepares the content (the view); Airflow sends it
      to meta.notify, only when the view returns rows.
    owner:
      name: team_use_case_2
    depends_on:
      - ref('vw_gld_l0_use_case_2__amount_anomaly_alerts')
    config:
      # Depends on a Python model: disabled where Python models cannot run.
      enabled: "{{ target.type not in ['postgres', 'redshift'] }}"
      tags: ["use_case_2", "daily"]
      meta:
        use_case: use_case_2
        consumer: alert
        ready_by: "08:00"
        notify: team_use_case_2
        criticality: medium
